name: Debian packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and package on Debian 12
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            rust:1-bookworm \
            bash -euxo pipefail -c '
              rustup component add rustfmt
              cargo fmt --check
              cargo test --locked
              cargo install cargo-deb --locked
              cargo build --release --locked
              max_glibc="$(objdump -T target/release/avel-pilot | sed -n "s/.*(GLIBC_\([0-9][0-9.]*\)).*/\1/p" | sort -V | tail -1)"
              if [ -n "$max_glibc" ] && [ "$(printf "%s\n" "2.36" "$max_glibc" | sort -V | tail -1)" != "2.36" ]; then
                echo "target/release/avel-pilot requires GLIBC_$max_glibc, but the maximum allowed version is GLIBC_2.36" >&2
                exit 1
              fi
              mkdir -p target/dist
              cp target/release/avel-pilot target/dist/avel-pilot-linux-amd64
              chmod 755 target/dist/avel-pilot-linux-amd64
              cargo deb --no-build
              cp target/debian/*.deb target/dist/avel-pilot-linux-amd64.deb
            '

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: avel-pilot-linux-amd64
          path: target/dist/avel-pilot-linux-amd64
          if-no-files-found: error

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: avel-pilot-debian-package
          path: |
            target/dist/avel-pilot-linux-amd64.deb
            target/debian/*.deb
          if-no-files-found: error

      - name: Publish assets on GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/avel-pilot-linux-amd64
            target/dist/avel-pilot-linux-amd64.deb
