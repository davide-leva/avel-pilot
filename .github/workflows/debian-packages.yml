name: Debian packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare release binary
        run: |
          mkdir -p target/dist
          cp target/release/avel-pilot target/dist/avel-pilot-linux-amd64
          chmod 755 target/dist/avel-pilot-linux-amd64

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Prepare Debian package
        run: cp target/debian/*.deb target/dist/avel-pilot-linux-amd64.deb

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: avel-pilot-linux-amd64
          path: target/dist/avel-pilot-linux-amd64
          if-no-files-found: error

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: avel-pilot-debian-package
          path: |
            target/dist/avel-pilot-linux-amd64.deb
            target/debian/*.deb
          if-no-files-found: error

      - name: Publish assets on GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/avel-pilot-linux-amd64
            target/dist/avel-pilot-linux-amd64.deb
